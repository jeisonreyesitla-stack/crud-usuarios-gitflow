<!-- pagina de login simple -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Iniciar Sesion</h1>
  <form id="formLogin">
    <input type="text" id="usuarioLogin" placeholder="Usuario" required>
    <input type="password" id="passwordLogin" placeholder="Password" required>
    <button type="submit">Entrar</button>
  </form>
  <p id="mensajeLogin"></p>

  <script>
    // logica simple de login, de prueba
    const formLogin = document.getElementById("formLogin");
    formLogin.addEventListener("submit", (e) => {
      e.preventDefault();
      const usuario = document.getElementById("usuarioLogin").value;
      // validacion basica, de prueba
      if (usuario.length > 0) {
        document.getElementById("mensajeLogin").innerText = "bienvenido " + usuario;
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
